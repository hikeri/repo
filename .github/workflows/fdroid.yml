name: Build F-Droid repo

# Запуск только вручную из вкладки Actions
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: true

env:
  # Значения по умолчанию на случай, если variables не заданы
  FDROID_REPO_NAME: My F-Droid Repo
  FDROID_REPO_DESCRIPTION: Автоматически собираемый F-Droid репозиторий.
  # Алиас ключа внутри keystore (совпадает с -alias из команды keytool)
  FDROID_KEY_ALIAS: fdroid

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.repo-url.outputs.url }}
    steps:
      # ПРОВЕРКА ОБЯЗАТЕЛЬНЫХ СЕКРЕТОВ ДО ЗАПУСКА ВСЕЙ СБОРКИ
      # GitHub маскирует секреты в логах, поэтому проверяем только
      # факт их наличия (непустая строка после раскрытия выражения)
      - name: Validate required secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.FDROID_PAT }}" ]; then
            MISSING="$MISSING\n- FDROID_PAT (Personal Access Token для GitHub API)"
          fi
          if [ -z "${{ secrets.FDROID_KEYSTORE }}" ]; then
            MISSING="$MISSING\n- FDROID_KEYSTORE (keystore.jks в base64)"
          fi
          if [ -z "${{ secrets.FDROID_KEYSTORE_PASSWORD }}" ]; then
            MISSING="$MISSING\n- FDROID_KEYSTORE_PASSWORD (пароль keystore)"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Отсутствуют обязательные секреты:$MISSING"
            echo "Создайте их в Settings -> Secrets and variables -> Actions -> Secrets"
            exit 1
          fi
          echo "Все обязательные секреты на месте"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # скрипт синхронизации
          pip install requests pyyaml pillow pyaxmlparser
          # СВЕЖИЙ androguard: старый из докер-образа падает с
          # ResParserError: res1 must be zero! на современных APK
          pip install androguard
          # fdroidserver из git-мастера (актуальнее любого докер-образа)
          pip install git+https://gitlab.com/fdroid/fdroidserver.git

      - name: Compute repo URL and generate config.yml
        id: repo-url
        env:
          GH_REPOSITORY: ${{ github.repository }}
          REPO_NAME: ${{ vars.FDROID_REPO_NAME || env.FDROID_REPO_NAME }}
          REPO_DESCRIPTION: ${{ vars.FDROID_REPO_DESCRIPTION || env.FDROID_REPO_DESCRIPTION }}
          KEY_ALIAS: ${{ vars.FDROID_KEY_ALIAS || env.FDROID_KEY_ALIAS }}
        run: |
          OWNER="${GH_REPOSITORY%/*}"
          NAME="${GH_REPOSITORY#*/}"

          # ПРОВЕРКА ИМЕНИ РЕПОЗИТОРИЯ:
          # 1) <owner>.github.io -> сайт в корне домена,
          #    содержимое кладём в подпапку repo,
          #    итоговый путь: https://owner.github.io/repo/
          # 2) имя "repo" -> содержимое артефакта в корне сайта,
          #    итоговый путь оканчивается на /repo за счёт имени репозитория:
          #    https://owner.github.io/repo/
          # 3) любое другое имя -> содержимое кладём в подпапку repo:
          #    https://owner.github.io/<имя>/repo/
          LOWER_NAME="$(echo "$NAME" | tr '[:upper:]' '[:lower:]')"
          LOWER_OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

          if [ "$LOWER_NAME" = "$LOWER_OWNER.github.io" ]; then
            BASE=""
            ROOT_DEPLOY="false"
          elif [ "$LOWER_NAME" = "repo" ]; then
            BASE="/$NAME"
            ROOT_DEPLOY="true"
          else
            BASE="/$NAME"
            ROOT_DEPLOY="false"
          fi

          URL="https://$OWNER.github.io$BASE/"
          if [ "$ROOT_DEPLOY" = "false" ]; then
            URL="${URL}repo/"
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "root_deploy=$ROOT_DEPLOY" >> "$GITHUB_OUTPUT"

          # Экранируем одинарные кавычки для безопасной подстановки в YAML
          ESC_NAME="$(printf '%s' "$REPO_NAME" | sed "s/'/''/g")"
          ESC_DESC="$(printf '%s' "$REPO_DESCRIPTION" | sed "s/'/''/g")"
          ESC_ALIAS="$(printf '%s' "$KEY_ALIAS" | sed 's/[^a-zA-Z0-9_-]//g')"

          cat > config.yml <<EOF
          repo_url: ${URL%/}
          repo_name: '${ESC_NAME}'
          repo_description: >-
            ${ESC_DESC}
          repo_icon: fdroid-icon.png
          # --- ключ для подписи индекса репозитория ---
          keystore: 'keystore.jks'
          repo_keyalias: ${ESC_ALIAS}
          keypass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          repo_keypass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          # --- пароли keystore (для сборки приложений, оставлены на будущее) ---
          keystorepass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          keystorekeypass: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          EOF

          # fdroid требует права 0600 на config.yml с паролями
          chmod 600 config.yml

          echo "Repo URL: $URL"
          echo "Repo name: $REPO_NAME"
          if [ "$ROOT_DEPLOY" = "true" ]; then
            echo "Deploy mode: корень сайта"
          else
            echo "Deploy mode: подпапка /repo"
          fi

      - name: Sync apps (metadata + APKs)
        env:
          GITHUB_TOKEN: ${{ secrets.FDROID_PAT }}
        run: python scripts/build_repo.py

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 -d > keystore.jks
          chmod 600 keystore.jks

      - name: Place repo icon
        run: |
          # fdroid ищет иконку в repo/icons/
          if [ -f fdroid-icon.png ]; then
            mkdir -p repo/icons
            cp fdroid-icon.png repo/icons/fdroid-icon.png
          else
            echo "fdroid-icon.png не найден, будет placeholder"
          fi

      - name: Run fdroid update
        run: fdroid update --pretty

      - name: Assemble site
        env:
          ROOT_DEPLOY: ${{ steps.repo-url.outputs.root_deploy }}
        run: |
          mkdir -p site
          if [ "$ROOT_DEPLOY" = "true" ]; then
            # содержимое каталога repo ложится прямо в корень сайта,
            # путь оканчивается на /repo за счёт имени репозитория
            cp -a repo/. site/
          else
            # содержимое каталога repo заворачиваем в подпапку repo,
            # чтобы путь всегда оканчивалось на /repo
            cp -a repo site/repo
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
